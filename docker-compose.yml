services:
  frontend:
    container_name: waterb_frontend
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 는 빌드 타임에 번들에 포함되므로 args로 전달
      # Cloudflare Tunnel(cloudflared, water_cf_net 공유)이 www.gimjewater.kr의
      # /water/* 를 backend(app:8080)로, 나머지는 frontend:3000으로 라우팅 — 같은 origin이라 CORS 불필요.
      args:
        NEXT_PUBLIC_API_BASE_URL: https://www.gimjewater.kr
        NEXT_PUBLIC_PAGE_SIZE: 15
        # Cloudflare 터널 없이 frontend를 직접 열었을 때의 폴백 — water_cf_net으로 backend(app)에 직접 연결
        WATER_REWRITE_DESTINATION: http://app:8080/water
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
      - water_cf_net

  nginx:
    image: nginx:alpine
    container_name: waterb_nginx
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    # host.docker.internal → 호스트 서버(백엔드가 실행 중인 서버)로 연결
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  # waterb_backend와 공유하는 외부 네트워크 — 같은 Cloudflare Tunnel의 cloudflared가
  # 이 frontend 컨테이너에도 도달하고, frontend가 backend(app)에도 직접 도달하도록 연결.
  # 사전에 `docker network create water_cf_net` 필요 (한 번만, backend 쪽에서 이미 생성했다면 생략).
  water_cf_net:
    external: true
